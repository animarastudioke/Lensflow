name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # Placeholder values only — nothing here needs to be a real secret.
          # NEXT_PUBLIC_SUPABASE_URL/ANON_KEY have safe fallbacks at runtime
          # (src/lib/supabase/env.ts), but SUPABASE_SERVICE_ROLE_KEY does not:
          # src/lib/supabase/admin.ts throws at module-load time if it's
          # missing, and Next's "Collecting page data" build step imports
          # every route module (including ones that import the admin
          # client), so the build fails without it even as a placeholder.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
